<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!--
  Controls carry data-feature="<flag>". On boot, main.js hides every
  control whose flag is switched off in /api/config. The server refuses
  those abilities independently -- hiding a control is presentation, not
  enforcement.
-->

<header class="banner" id="banner" hidden></header>

<div class="layout">

  <aside class="controls">
    <h1>LLM Playground</h1>

    <label class="control" data-feature="model_switcher">
      <span>Model</span>
      <select id="model"></select>
      <small id="model-detail" class="hint"></small>
    </label>

    <label class="control">
      <span>System prompt</span>
      <textarea id="system" rows="3" placeholder="Optional. Sets the model's role."></textarea>
    </label>

    <label class="control">
      <span>Temperature <output id="temperature-value">0.8</output></span>
      <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.8" />
      <small class="hint">0 is near-deterministic. Above ~1.2 tends to ramble.</small>
    </label>

    <label class="control">
      <span>Top-p <output id="top_p-value">0.9</output></span>
      <input id="top_p" type="range" min="0" max="1" step="0.05" value="0.9" />
    </label>

    <label class="control">
      <span>Seed</span>
      <input id="seed" type="number" placeholder="blank = random" />
      <small class="hint">Fix it to repeat a sample exactly.</small>
    </label>

    <label class="control">
      <span>Context window (num_ctx)</span>
      <input id="num_ctx" type="number" placeholder="model default" min="256" step="256" />
      <small class="hint">Shrink it to watch older turns fall out.</small>
    </label>

    <label class="control toggle" data-feature="reasoning" id="think-control" hidden>
      <input id="think" type="checkbox" />
      <span>Show reasoning</span>
      <small class="hint">Only offered by models with the thinking capability.</small>
    </label>

    <div class="control" data-feature="structured_output">
      <label class="toggle">
        <input id="schema-enabled" type="checkbox" />
        <span>Force JSON schema</span>
      </label>
      <textarea id="schema" rows="7" spellcheck="false" hidden></textarea>
      <small class="hint">The reply is constrained to match this schema.</small>
    </div>

    <label class="control toggle" data-feature="compare">
      <input id="compare" type="checkbox" />
      <span>Compare two models</span>
    </label>

    <label class="control" data-feature="compare" id="model-b-control" hidden>
      <span>Second model</span>
      <select id="model-b"></select>
    </label>

    <button id="reset" class="secondary" type="button">Clear conversation</button>
  </aside>

  <main class="chat">
    <div class="lanes" id="lanes">
      <section class="lane" data-lane="a">
        <h2 class="lane-title" hidden></h2>
        <div class="messages" id="messages-a"></div>
      </section>
      <section class="lane" data-lane="b" hidden>
        <h2 class="lane-title" hidden></h2>
        <div class="messages" id="messages-b"></div>
      </section>
    </div>

    <form class="composer" id="composer">
      <textarea id="input" rows="2" placeholder="Ask something. Enter sends, Shift+Enter adds a line."></textarea>
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" class="secondary" hidden>Stop</button>
    </form>
  </main>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
