[project]
name = "llm-playground"
version = "0.2.0"
description = "An educational playground for local small language models, powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alon Shabat" }]
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "rich>=13.7",
]

[project.scripts]
slm = "playground.cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs a reachable Ollama instance; skipped by default in CI",
]
